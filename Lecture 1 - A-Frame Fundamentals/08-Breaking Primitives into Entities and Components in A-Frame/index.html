<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Primitives into Entities and Components in A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Step 3: Background image through the asset system -->
        <a-assets>
            <img id="L10-img-BG" src="assets/L10-img-background.jpg">
        </a-assets>

        <a-image src="#L10-img-BG" position="0 1.6 -11" scale="12 9 1"></a-image>

        <!-- Step 1: Default box primitive (1 m on every side, white, at 0 0 0).
             Step 5: changed to red so it matches the entity below. -->
        <a-box color="#AA0000" height="1.5" position="-1 0.5 -4"></a-box>

        <!-- Step 2: The same box built from a plain <a-entity> by attaching
             the geometry, material and position components by hand. -->
        <a-entity geometry="primitive: box; height: 1.5"
                  material="shader: standard; color: #AA0000"
                  position="1 0.5 -4">
        </a-entity>

        <!-- Step 4: A curved image rebuilt from components only.
             It mimics <a-curvedimage> using an open-ended cylinder. -->
        <a-entity geometry="primitive: cylinder;
                            theta-length: 90;
                            theta-start: 135;
                            radius: 0.707;
                            height: 0.833;
                            open-ended: true"
                  material="shader: flat;
                            color: #FFFFFF;
                            side: double;
                            src: #L10-img-BG"
                  position="0 1.5 0"
                  scale="-10 10 10">
        </a-entity>
    </a-scene>
</body>
</html>
