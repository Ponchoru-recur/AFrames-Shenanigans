<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhancing 3D Objects with Textures and Materials in A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Step 2: Asset management. Preloads the textures for better performance.
             Textures from https://polyhaven.com/ -->
        <a-assets>
            <img id="metal" src="assets/rusty_metal_grid_diff_4k.jpg">
            <img id="metal-NRM" src="assets/rusty_metal_grid_disp_4k.png">
            <img id="brick" src="assets/broken_brick_wall_diff_4k.jpg">
            <img id="brick-NRM" src="assets/broken_brick_wall_disp_4k.png">
        </a-assets>

        <!-- Step 1 (original): two plain boxes
        <a-box color="#8EACBB" width="4" height="4" depth="4" position="-2 1.5 -9"></a-box>
        <a-box color="#795548" width="4" height="4" depth="4" position="2 1.5 -9"></a-box>
        -->

        <!-- Step 3: Metal texture with a normal map on the light blue box.
             Step 5: scale="-1 1 1" flips the box so we see its inside, like a room.
             Change it to scale="1 1 1" to see the outside. -->
        <a-box color="#FFFFFF"
               src="#metal"
               normal-map="#metal-NRM"
               normal-scale="1 -1"
               roughness="0.5"
               width="4" height="4" depth="4"
               position="-2 1.5 -9"
               scale="-1 1 1"
               side="double">
        </a-box>

        <!-- Step 4: Brick texture through the material component.
             repeat: 2 2 tiles the texture; roughness 0.9 makes it matte. -->
        <a-box material="color: #FFFFFF;
                         src: #brick;
                         repeat: 2 2;
                         normal-map: #brick-NRM;
                         normal-texture-repeat: 2 2;
                         normal-scale: 1 -1;
                         roughness: 0.9"
               width="4" height="4" depth="4"
               position="2 1.5 -9"
               scale="-1 1 1"
               side="double">
        </a-box>

        <!-- Step 6: Blue glossy sphere using the standard material -->
        <a-sphere material="color: #0000AA; roughness: 0.2; shader: standard"
                  radius="0.5"
                  position="-2 1.5 -8">
        </a-sphere>

        <!-- Step 7: Red semi-transparent sphere. The flat shader ignores light;
             opacity 0.5 makes it see-through. -->
        <a-sphere material="color: #AA0000;
                            roughness: 0.2;
                            shader: flat;
                            opacity: 0.5"
                  radius="0.5"
                  position="2 1.5 -8">
        </a-sphere>
    </a-scene>
</body>
</html>
