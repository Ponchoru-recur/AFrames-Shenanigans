<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaling and Reflecting Entities in A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Step 4: Reflect the box with scale="-1 1 2" (flips it along the X-axis).
             Step 6: side="double" keeps the reflected box visible.
             Step 5: the child circle is scaled together with its parent (relative scaling). -->
        <a-box color="#689F38"
               width="4"
               height="2"
               depth="0.2"
               position="0 1 -7"
               rotation="90 0 0"
               scale="-1 1 2"
               side="double">
            <!-- Step 7: negative scale on a circle mirrors it; side="double" shows both faces -->
            <a-circle color="#333333"
                      side="double"
                      position="2 0 0"
                      rotation="90 0 0"
                      scale="-1 1 1">
            </a-circle>
        </a-box>

        <!-- Step 2: Basic scaling. Doubles the yellow circle in X and Y. -->
        <a-circle color="#FFC107"
                  side="double"
                  position="-2 1 -8"
                  scale="2 2 1">
        </a-circle>

        <!-- Step 3: Compound transformation. The cylinder is already rotated,
             so scale="2 2 2" stretches it along its own rotated axes. -->
        <a-cylinder color="#616161"
                    height="2"
                    radius="2"
                    segments-radial="6"
                    open-ended="true"
                    side="double"
                    position="0 1 0"
                    rotation="0 -90 90"
                    scale="2 2 2">
        </a-cylinder>
    </a-scene>
</body>
</html>
