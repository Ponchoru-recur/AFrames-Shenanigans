<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <title>Customizing the Sky and Virtual Environment in A-Frame</title>
</head>
<body>
    <a-scene>
        <!-- Asset Management System -->
        <a-assets>
            <img id="floor" src="assets/concrete_floor_damaged_01_diff_4k.jpg">
            <img id="floor-NRM" src="assets/concrete_floor_damaged_01_nor_gl_4k.jpg">
            <img id="floor-roughness" src="assets/concrete_floor_damaged_01_rough_4k.jpg">
            <img id="floor-ao" src="assets/concrete_floor_damaged_01_ao_4k.jpg">
            <img id="clear-sunny-sky" src="assets/clear-sunny-sky.jpg">
            <img id="360-panorama" src="assets/360-image.jpg">
        </a-assets>

        <!-- Step 1: Sky with a custom texture, rotated so the sun lines up with the lighting -->
        <a-sky src="#clear-sunny-sky" rotation="0 64 0"></a-sky>

        <!-- Step 2: Ground scaled to 10,000 m so it reaches the inner edge of the
             default <a-sky>, removing visual gaps. -->
        <a-plane material="color: #FFFFFF;
                           src: #floor;
                           repeat: 1000 1000;
                           normal-map: #floor-NRM;
                           normal-texture-repeat: 1000 1000;
                           roughness-map: #floor-roughness;
                           roughness-texture-repeat: 1000 1000;
                           roughness: 0.9;
                           ambient-occlusion-map: #floor-ao;
                           ambient-occlusion-texture-repeat: 1000 1000;
                           ambient-occlusion-map-intensity: 0.5"
                 position="0 0 0"
                 rotation="-90 0 0"
                 scale="10000 10000 1">
        </a-plane>

        <!-- Step 3: Cartoon-style ground. shader: flat removes lighting for a game-like look.
             To try it, comment out the ground above and uncomment this one.
        <a-plane material="color: #00AA00; shader: flat"
                 rotation="-90 0 0"
                 scale="10000 10000 1">
        </a-plane>
        -->

        <!-- Step 4: 360 degree image as the background. Wraps a single equirectangular
             photo around the user. To try it, comment out the sky and ground above
             and uncomment this line.
             Photo: https://texturify.com/stock-photo/room-in-private-flat-10097.html
        <a-sky src="#360-panorama"></a-sky>
        -->
    </a-scene>
</body>
</html>
