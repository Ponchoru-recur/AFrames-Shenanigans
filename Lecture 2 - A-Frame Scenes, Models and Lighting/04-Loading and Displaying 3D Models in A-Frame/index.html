<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading and Displaying 3D Models in A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Step 4: Position logger used to find where the models should go.
         Turn it back on (remove the comment markers) together with the "player"
         camera below when you need to find new coordinates.
    <script>
        // Prevent scroll zooming
        window.addEventListener('wheel', e => e.preventDefault(), { passive: false });

        // Log position every 0.5 seconds
        AFRAME.registerComponent('log-position', {
            init: function () { this.lastTime = 0; },
            tick: function (time) {
                if (time - this.lastTime > 500) {
                    const pos = this.el.object3D.position;
                    console.log(`Player → X:${pos.x.toFixed(2)} Y:${pos.y.toFixed(2)} Z:${pos.z.toFixed(2)}`);
                    this.lastTime = time;
                }
            }
        });
    </script>
    -->
</head>
<body>
    <a-scene>
        <!-- Step 1: Asset Management System
             Castle scene: https://sketchfab.com/3d-models/castle-village-scene-675b3afce21a4acaa1140645a5206db3
             Catapult:     https://poly.pizza/m/9ahVI0EjjEi -->
        <a-assets>
            <a-asset-item id="castle-scene" src="assets/scene.gltf"></a-asset-item>
            <a-asset-item id="catapult-obj" src="assets/Catapult.obj"></a-asset-item>
            <a-asset-item id="catapult-mtl" src="assets/Catapult.mtl"></a-asset-item>
            <img id="sky" src="assets/clear-sunny-sky.jpg">
        </a-assets>

        <!-- Step 2: Sky and camera -->
        <a-sky src="#sky"></a-sky>

        <!-- Camera -->
        <a-entity position="0 5 0">
            <a-camera></a-camera>
        </a-entity>

        <!-- Step 4: Temporary camera used for position logging
        <a-entity
            id="player"
            camera
            look-controls
            wasd-controls="acceleration: 50"
            position="0 5 10"
            log-position>
        </a-entity>
        -->

        <!-- Step 3: Load the 3D models into the scene -->
        <!-- Castle Scene (.gltf) -->
        <a-entity gltf-model="#castle-scene" position="0 0 0" scale="500 500 500"></a-entity>

        <!-- Catapult (.obj + .mtl)
             Step 5: moved from "-10 0 50" to the coordinates found with the logger,
             which places it outside the castle. -->
        <a-entity obj-model="obj: #catapult-obj; mtl: #catapult-mtl"
                  position="-53.64 0 294.73"
                  rotation="0 200 0"
                  scale="1 1 1">
        </a-entity>
    </a-scene>
</body>
</html>
